name: autorelease

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: jdx/mise-action@v2
        with:
          install: true

      - name: Install dependencies
        run: mise run install

      - name: Codegen
        run: mise run codegen

      - name: Create PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: update codegen"
          title: "chore: update codegen"
          body: "Auto-generated changes from codegen."
          branch: "codegen-update"
          delete-branch: true
          base: main

      - name: Run CI
        run: mise run ci

      - name: Build Artifacts (Release/Tag/Dispatch)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: mise run build

      - name: Release (Tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} output/* --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Artifacts (Release/Tag/Dispatch)
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v6
        with:
          name: bundle.zip
          path: output/*
