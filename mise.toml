[tools]
python = "3.12"
"github:lucasew/workspaced" = "0.1.3"

[tasks]
install = { run = "pip install -U pip", description = "Install dependencies" }
lint = { run = "workspaced codebase lint", description = "Lint code" }
fmt = { run = "workspaced codebase format", description = "Format code" }
test = { run = "python3 -m py_compile build.py", description = "Run tests" }
codegen = { run = "echo 'No codegen'", description = "Run codegen" }
build = { run = "rm -rf output && python3 build.py output", description = "Build artifact" }
ci = { depends = ["lint", "test"], description = "Run CI pipeline" }
